<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная №4. Цвета и фон</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Пункт 1: три цветовые модели -->
    <div class="block color-block-1">Цвет фона задан моделью RGB</div>
    <div class="block color-block-2">Цвет фона задан моделью HSL</div>
    <div class="block color-block-3">Цвет фона задан моделью HEX</div>

    <!-- Пункт 2: три варианта работы с фоновыми изображениями -->
    <div class="block image-block-1">Фоновое изображение растянуто на весь экран</div>
    <div class="block image-block-2">Повторяющееся изображение по горизонтали</div>
    <div class="block image-block-3">Фоновое изображение справа внизу</div>

    <!-- Пункт 3: два градиента -->
    <div class="block gradient-block-1">Линейный градиент</div>
    <div class="block gradient-block-2">Радиальный градиент</div>

    <!-- Пункт 4: два полупрозрачных фона -->
    <div class="block alpha-block-1">Полупрозрачный фон (RGBA)</div>
    <div class="block alpha-block-2">Полупрозрачный фон (HSLA)</div>

</body>
</html>
